<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control de Torque">
    <title>{{ title if title else "Control de Torque | Laboratorio" }}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=1.2">
</head>
<body>
    <div class="background-glow"></div>

    <div class="app-layout">
        <!-- Main Header -->
        <header class="main-header">
            <div class="header-brand">
                <div class="brand-badge"><i class="fa-solid fa-wrench badge-icon"></i></div>
                <div>
                    <h1>Control de <span class="highlight-text">Torque</span></h1>
                    <p class="header-subtitle">Línea de Producción - Ajuste de Tapas</p>
                </div>
            </div>

            <!-- Global Controls -->
            <div class="header-global-controls">
                
<a href="/" class="btn-dashboard-header" title="Volver al Portal" style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: #e2e8f0; font-weight: 600; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.2s ease;">
    <i class="fa-solid fa-arrow-left"></i> Volver al Portal
</a>

            </div>

            <div class="header-status">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Conectado a PostgreSQL</span>
                </div>
            </div>
        </header>

        
        <div id="tab-torque" class="tab-content-standalone" style="padding-top:20px;" >
            <div class="main-container">
                <form id="torque-form" class="qc-flex-container">
                    
                    <!-- Left Column: ParÃ¡metros (Main Form) -->
                    <div class="main-content-card glass-card">
                        <div class="card-header">
                            <span class="card-icon"><i class="fa-solid fa-square-poll-horizontal"></i></span>
                            <h2>1. ParÃ¡metros de Torque</h2>
                        </div>
                        
                        <div class="form-grid">
                            <!-- NÃºmero de Torque (Cabezal) -->
                            <div class="field-container col-span-2">
                                <label for="torque_numero">Cabezal NÂ°</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-hashtag input-icon"></i>
                                    <select id="torque_numero" name="torque_numero" required>
                                        <option value="" disabled selected>Seleccione cabezal...</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Noche sub-section (visible solo si turno=Noche) -->
                            <div class="field-container col-span-2 noche-section field-hidden" id="torque_noche_section">
                                <label>Turno de Noche</label>
                                <div class="toggle-group-premium">
                                    <label class="toggle-option">
                                        <input type="radio" name="torque_noche" value="Noche 1" checked>
                                        <span class="toggle-button button-noche">
                                            <i class="fa-solid fa-moon"></i> Noche 1
                                        </span>
                                    </label>
                                    <label class="toggle-option">
                                        <input type="radio" name="torque_noche" value="Noche 2">
                                        <span class="toggle-button button-noche">
                                            <i class="fa-solid fa-star-half-stroke"></i> Noche 2
                                        </span>
                                    </label>
                                </div>
                            </div>

                            <!-- Valor -->
                            <div class="field-container col-span-2">
                                <label for="torque_valor">Valor (Lbs-in)</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-gauge-high input-icon"></i>
                                    <input type="number" step="any" id="torque_valor" name="torque_valor" required placeholder="Ej: 12.5">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="btn-reset-torque">
                                <i class="fa-solid fa-eraser"></i> Limpiar
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Guardar Torque
                            </button>
                        </div>
                    </div>

                    <!-- Right Column: Torque Data (Sidebar Card) -->
                    <div class="sidebar-card glass-card">
                        <div class="card-header">
                            <span class="card-icon"><i class="fa-solid fa-industry"></i></span>
                            <h2>2. Datos de ProducciÃ³n</h2>
                        </div>
                        
                        <div class="sidebar-form-grid">
                            <!-- Sabor (Marcas) -->
                            <div class="field-container">
                                <label for="torque_sabor">Sabor</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-lemon input-icon"></i>
                                    <select id="torque_sabor" name="torque_sabor" required>
                                        <option value="" disabled selected>Cargando sabores...</option>
                                    </select>
                                </div>
                            </div>
                            <!-- Marca -->
                            <div class="field-container">
                                <label for="torque_marca">Marca</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-tag input-icon"></i>
                                    <select id="torque_marca" name="torque_marca" required>
                                        <option value="" disabled selected>Seleccione marca...</option>
                                        <option value="Priva">Priva</option>
                                        <option value="Side">Side</option>
                                    </select>
                                </div>
                            </div>
                            <!-- Color (Readonly, auto-calculated) -->
                            <div class="field-container">
                                <label for="torque_color">Color</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-palette input-icon"></i>
                                    <input type="text" id="torque_color" name="torque_color" readonly placeholder="Auto-calculado..." class="readonly-input">
                                </div>
                            </div>
                            <!-- Responsable -->
                            <div class="field-container">
                                <label for="torque_responsable">Resp.</label>
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-user input-icon"></i>
                                    <select id="torque_responsable" name="torque_responsable" required>
                                        <option value="" disabled selected>Cargando responsables...</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="sidebar-hint">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>Los datos de producciÃ³n se mantienen para cargar mÃºltiples mediciones.</span>
                        </div>
                    </div>
                </form>
            </div>
        </div> 

    </div>

    

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- App Logic Script -->
    <script src="/static/js/app.js?v=3.0"></script>
</body>
</html>
